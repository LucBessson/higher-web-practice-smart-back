spring.application.name=smart-back

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart}
spring.datasource.username=${DB_USER:smart}
spring.datasource.password=${DB_PASSWORD:smart}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

ollama.base-url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma3:4b}
ollama.max-retries=${OLLAMA_MAX_RETRIES:3}

server.port=${SERVER_PORT:8080}
